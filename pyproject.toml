[project]
name = "billy_crew"
version = "0.1.0"
description = "billy_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.22,<2.0.0"
]

[project.scripts]
billy_crew = "billy_crew.main:run"
run_crew = "billy_crew.main:run"
train = "billy_crew.main:train"
replay = "billy_crew.main:replay"
test = "billy_crew.main:test"
run_with_trigger = "billy_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "11c400b9-a6bb-4cb2-a233-bc3bca8bc961"
